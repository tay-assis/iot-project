<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Fonte e CSS -->
  <link rel="stylesheet" href="./cadastro-2.scss">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  
  <title>Registro de Senha</title>
</head>
<body>
  <main class="cadastro-container">
    
    <!-- Cabeçalho da página -->
    <header class="cadastro-header">
      <h1 class="cadastro-titulo">Registro</h1>
      <p class="cadastro-subtitulo">Registre aqui sua nova senha</p>
    </header>

    <!-- Formulário de cadastro -->
    <section class="cadastro-form-section">
      <form class="form-cadastro">
        
        <!-- Campo nome da plataforma -->
        <div class="form-group">
          <label for="plataforma">Nome da Plataforma</label>
          <input type="text" id="plataforma" name="plataforma" placeholder="Ex: Netflix, Google..." required>
        </div>
        
        <!-- Campo senha original -->
        <div class="form-group">
          <label for="senha">Insira sua senha original</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>
        
        <!-- Botões -->
        <div class="form-actions">
          <button type="submit" class="btn-login">Registrar nova senha</button>
          <button type="button" class="btn-registrar">Voltar</button>
        </div>
      </form>
    </section>
    
  </main>
</body>
</html>
