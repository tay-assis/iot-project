<app-ui-box title="Cadastro de Aluno">

  <app-ui-input
    label="Nome"
    (valueChange)="professor.name = $event"
  ></app-ui-input>

  <app-ui-input
    label="Email"
    (valueChange)="professor.email = $event"
  ></app-ui-input>

  <app-ui-input
    label="Senha"
    (valueChange)="professor.password = $event"
    type ="password"
  ></app-ui-input>

  <button (click)="submit()">Salvar</button>

</app-ui-box>
