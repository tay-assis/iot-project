<app-ui-box title="Cadastro de Aluno">

  <app-ui-input
    label="Nome"
    (valueChange)="student.name = $event"
  ></app-ui-input>

  <app-ui-input
    label="RA"
    (valueChange)="student.registrationNumber = $event"
  ></app-ui-input>
  <app-ui-input
    label="numero da digital"
    (valueChange)="student.fingerprintId = $event"
  ></app-ui-input>

  <button (click)="submit()">Salvar</button>

</app-ui-box>
