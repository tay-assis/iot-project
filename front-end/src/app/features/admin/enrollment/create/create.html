<app-ui-box title="Matricular Aluno">

  <app-ui-select
    label="Aluno"
    [options]="students"
    displayKey="name"
    valueKey="id"
    (valueChange)="enrollment.studentId = +$event"
  ></app-ui-select>

  <app-ui-select
    label="Classe"
    [options]="classes"
    displayKey="name"
    valueKey="id"
    (valueChange)="enrollment.classId = +$event"
  ></app-ui-select>

  <button (click)="submit()">Matricular</button>

</app-ui-box>
